# SCRUM-132: PR-Vorschaukanaele bei Firebase Hosting aufraeumen, damit das Kanal-Kontingent nicht volllaeuft
# (sonst bekommen neue PRs keine Vorschau mehr: "429 channel quota reached").
#
# - pull_request "closed" (gemergt oder geschlossen): loescht die Vorschau genau dieses PRs.
# - workflow_dispatch (von Hand in GitHub -> Actions starten): loescht die Vorschauen aller PRs, die schon
#   geschlossen sind. Vorschauen offener PRs und der Live-Kanal bleiben unangetastet.
#
# Sicherheit (wie SCRUM-57): Hier laeuft kein Code aus dem PR. Ausgecheckt wird nur der Standard-Branch (fuer
# firebase.json/.firebaserc), es gibt kein npm install aus dem Repo; firebase-tools ist fest gepinnt.

name: Clean up Firebase preview channels
on:
  pull_request:
    types: [closed]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: firebase-preview-cleanup
  cancel-in-progress: false
jobs:
  cleanup:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    env:
      SITE: teamkompass-b8aac
      PROJECT: teamkompass-b8aac
      FIREBASE_TOOLS: firebase-tools@15.32.1
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Service-Account bereitstellen
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TEAMKOMPASS_B8AAC }}
        run: |
          printf '%s' "$SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
      - name: Vorschaukanaele loeschen
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          npx --yes "$FIREBASE_TOOLS" hosting:channel:list --site "$SITE" --project "$PROJECT" --json > "$RUNNER_TEMP/channels.json"
          # Kanal-IDs der PR-Vorschauen haben die Form pr<Nummer>-<Branch> (FirebaseExtended/action-hosting-deploy).
          node -e '
            const out = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
            for (const c of out.result.channels) {
              const id = c.name.split("/").pop();
              const m = /^pr(\d+)-/.exec(id);
              if (m) console.log(m[1] + " " + id);
            }
          ' "$RUNNER_TEMP/channels.json" > "$RUNNER_TEMP/pr-channels.txt"
          echo "Gefundene PR-Vorschaukanaele: $(wc -l < "$RUNNER_TEMP/pr-channels.txt")"
          deleted=0
          while read -r -u 3 number channel; do
            if [ -n "$PR_NUMBER" ]; then
              [ "$number" = "$PR_NUMBER" ] || continue
            else
              state=$(gh pr view "$number" --repo "$GITHUB_REPOSITORY" --json state --jq .state < /dev/null)
              [ "$state" != "OPEN" ] || { echo "behalte $channel (PR #$number ist offen)"; continue; }
            fi
            echo "loesche $channel"
            npx --yes "$FIREBASE_TOOLS" hosting:channel:delete "$channel" --site "$SITE" --project "$PROJECT" --force < /dev/null
            deleted=$((deleted + 1))
          done 3< "$RUNNER_TEMP/pr-channels.txt"
          echo "Geloescht: $deleted"
      - name: Service-Account entfernen
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
