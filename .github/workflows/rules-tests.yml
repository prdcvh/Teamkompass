name: Firestore rules tests

# Prueft firestore.rules gegen den lokalen Firebase-Emulator (SCRUM-38). Kein Secret, keine echten Daten.
on:
  pull_request:
    paths:
      - 'firestore.rules'
      - 'firebase.json'
      - 'tests/rules/**'
      - '.github/workflows/rules-tests.yml'
  push:
    branches: [main]
    paths:
      - 'firestore.rules'
      - 'firebase.json'
      - 'tests/rules/**'
      - '.github/workflows/rules-tests.yml'

permissions:
  contents: read

jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install rules test dependencies (ohne Install-Skripte)
        run: npm ci --ignore-scripts --prefix tests/rules
      - name: Run rules tests against the Firestore emulator
        run: npm test --prefix tests/rules
