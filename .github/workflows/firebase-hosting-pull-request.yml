#
# Aufbau (SCRUM-57): Code des Pull Requests (npm ci, verify) laeuft nur im Job "verify" OHNE Zugriff auf das
# Service-Account-Secret. Der Job "build_and_preview" mit dem Secret fuehrt keinen PR-Code und keine
# npm-Install-Skripte aus, er laedt nur die statischen Dateien in den Vorschau-Kanal.

name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  verify:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Angular dependencies (ohne Install-Skripte)
        run: npm ci --ignore-scripts --prefix angular
      - name: Verify application
        run: npm run verify
  build_and_preview:
    needs: verify
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TEAMKOMPASS_B8AAC }}
          projectId: teamkompass-b8aac
          target: main
