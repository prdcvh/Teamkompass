name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  verify:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install Angular dependencies (ohne Install-Skripte)
        run: npm ci --ignore-scripts --prefix angular
      - name: Verify application
        run: npm run verify
      # Angular-Standard-Build (Testteam U14, kein Live-Team) als Vorschau auf der Site teamkompass-u14.
      - uses: actions/upload-artifact@v7
        with:
          name: angular-dist
          path: angular/dist/teamkompass-angular/browser
          if-no-files-found: error
          retention-days: 1
  build_and_preview:
    needs: verify
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TEAMKOMPASS_B8AAC }}
          projectId: teamkompass-b8aac
          target: main
      - uses: actions/download-artifact@v8
        with:
          name: angular-dist
          path: angular/dist/teamkompass-angular/browser
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TEAMKOMPASS_B8AAC }}
          projectId: teamkompass-b8aac
          target: u14
