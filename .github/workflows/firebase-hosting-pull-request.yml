name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  verify:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install Angular dependencies (ohne Install-Skripte)
        run: npm ci --ignore-scripts --prefix angular
      - name: Verify application
        run: npm run verify
      # Angular-Standard-Build (Testteam U14, kein Live-Team) als Vorschau auf der Site teamkompass-u14.
      - uses: actions/upload-artifact@v7
        with:
          name: angular-dist
          path: angular/dist/teamkompass-angular/browser
          if-no-files-found: error
          retention-days: 1
      # Alt-App-Vorschau: Kopie von outputs/u15, aber mit dem Testteam U14 statt U15 (echte Daten).
      - name: Alt-App-Vorschau mit Testteam bauen
        run: node scripts/legacy-preview.mjs outputs/u15
      - uses: actions/upload-artifact@v7
        with:
          name: legacy-preview
          path: dist/preview/u15
          if-no-files-found: error
          retention-days: 1
  build_and_preview:
    needs: verify
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Fuer das Haupt-Team (Ziel main, Angular) gibt es keine Vorschau mehr (echte Daten mein-team).
      # Alt-App (U15): statt outputs/u15 aus dem Repo (echte Daten) nur die Vorschau-Kopie mit dem Testteam ausliefern.
      - name: Alt-App-Ordner leeren
        run: rm -rf outputs/u15
      - uses: actions/download-artifact@v8
        with:
          name: legacy-preview
          path: outputs/u15
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TEAMKOMPASS_B8AAC }}
          projectId: teamkompass-b8aac
          target: u15
      - uses: actions/download-artifact@v8
        with:
          name: angular-dist
          path: angular/dist/teamkompass-angular/browser
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TEAMKOMPASS_B8AAC }}
          projectId: teamkompass-b8aac
          target: u14
